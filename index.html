function expenseStats(expenses,ledger,month,hidden=false,entities=[],tasks=[]){
  const rows=expenses.filter(e=>e.ledger===ledger&&e.date.slice(0,7)===month&&visibleExpense(e,hidden,entities,tasks));
  const categories=Object.fromEntries(EXPENSE_CATEGORIES[ledger].map(c=>[c,0]));
  for(const e of rows)categories[e.category]+=e.amount_cents;
  return {rows,total:rows.reduce((sum,e)=>sum+e.amount_cents,0),count:rows.length,categories};
}
function budgetState(budgets,ledger,month,total,hidden=false){
  if(hidden&&ledger==='home')return {hidden:true,amount:null,remaining:null,percent:0,level:'hidden'};
  const amount=budgets.find(b=>b.ledger===ledger&&b.month===month)?.amount_cents??null;
  if(amount===null)return {hidden:false,amount:null,remaining:null,percent:0,level:'unset'};
  return {hidden:false,amount,remaining:amount-total,percent:Math.min(100,total/amount*100),level:total>amount?'over':total>=amount*.8?'near':'normal'};
}
function validateExpenses(store,entityIds,taskIds,fail){
  if(store.schema===3&&(!Array.isArray(store.expenses)||!Array.isArray(store.budgets)))fail();
  const expenses=store.schema===3?store.expenses:[],budgets=store.schema===3?store.budgets:[];
  if(expenses.length+budgets.length>20000)fail();
  const ids=new Set(),budgetKeys=new Set(),text=(v,n=30000)=>typeof v==='string'&&v.length<=n;
  for(const e of expenses){
    if(!e||typeof e!=='object'||!Object.hasOwn(LEDGERS,e.ledger)||!EXPENSE_CATEGORIES[e.ledger].includes(e.category)||!['personal','family'].includes(e.scope)||e.ledger==='unit'&&e.scope!=='personal'||!text(e.id,32)||!/^[a-f0-9]{32}$/.test(e.id)||ids.has(e.id)||!text(e.title,200)||!e.title.trim()||!validDay(e.date)||!Number.isSafeInteger(e.amount_cents)||e.amount_cents<=0||e.amount_cents>MONEY_LIMIT||!PAYMENT_METHODS.includes(e.payment)||!text(e.merchant,200)||!text(e.notes)||!text(e.created)||!text(e.updated))fail();
    if(e.entity_id!==null&&!entityIds.has(e.entity_id)||e.task_id!==null&&!taskIds.has(e.task_id)||e.entity_id&&e.task_id)fail();
    ids.add(e.id);
  }
  for(const b of budgets){
    if(!b||!Object.hasOwn(LEDGERS,b.ledger)||!validMonth(b.month)||!Number.isSafeInteger(b.amount_cents)||b.amount_cents<=0||b.amount_cents>MONEY_LIMIT||budgetKeys.has(b.ledger+':'+b.month))fail();
    budgetKeys.add(b.ledger+':'+b.month);
  }
  return {expenses:structuredClone(expenses),budgets:structuredClone(budgets)};
}

const STORAGE_KEY = 'zhixing-workbench-html-v3';
const PREVIOUS_STORAGE_KEY = 'zhixing-workbench-html-v2';
const LEGACY_STORAGE_KEY = 'zhixing-workbench-html-v1';
function freshStore() {return {schema:3,entities:[],tasks:[],reviews:[],expenses:[],budgets:[]};}
function readStore() {
  let raw,legacy;
  try {raw=localStorage.getItem(STORAGE_KEY);if(raw===null){legacy=localStorage.getItem(PREVIOUS_STORAGE_KEY);if(legacy===null)legacy=localStorage.getItem(LEGACY_STORAGE_KEY);}} catch {throw new Error('当前浏览器不允许保存数据。请用普通浏览模式，或将 HTML 放到您自己的静态网站中访问。');}
  if(raw===null&&legacy===null)return freshStore();
  let store;
  try {store=validateStore(JSON.parse(raw===null?legacy:raw));} catch {throw new Error('浏览器中的记录格式异常，未覆盖原数据。请保留数据并从备份恢复。');}
  if(raw===null)saveStore(store);
  return store;
}
function saveStore(store) {
  const valid=validateStore(store);
  try {localStorage.setItem(STORAGE_KEY,JSON.stringify(valid));} catch {throw new Error('保存失败：浏览器存储已满或被禁用。请先导出记录，不要关闭尚未保存的表单。');}
}
function validateStore(store) {
  const fail=()=>{throw new Error('备份格式或记录关联不正确，当前数据保持不变。');};
  const dateOK=v=>v==null||v===''||validDay(v);
  const textOK=v=>typeof v==='string'&&v.length<=30000;
  const idOK=v=>typeof v==='string'&&/^[a-f0-9]{32}$/.test(v);
  if(!store||![1,2,3].includes(store.schema)||!Array.isArray(store.entities)||!Array.isArray(store.tasks)||!Array.isArray(store.reviews))fail();
  if(store.entities.length+store.tasks.length+store.reviews.length>20000)fail();
  const ids=new Map();
  for(const e of store.entities){
    if(!e||!idOK(e.id)||ids.has(e.id)||!['project','learning','exam','mistake'].includes(e.kind)||!textOK(e.title)||!e.title.trim()||!['active','done','archived'].includes(e.status)||!e.details||typeof e.details!=='object'||Array.isArray(e.details)||!textOK(e.created)||!textOK(e.updated))fail();
    for(const [key,value] of Object.entries(e.details)){
      if(['score','full_score'].includes(key)){if(value!==null&&(typeof value!=='number'||!Number.isFinite(value)||value<0||value>10000))fail();}
      else if(['due','exam_date','next_review'].includes(key)){if(!dateOK(value))fail();}
      else if(key==='project_id'){if(value!=null&&!idOK(value))fail();}
      else if(!textOK(value))fail();
    }
    if(e.kind==='exam'&&(!dateOK(e.details.exam_date)||!e.details.exam_date||!(e.details.full_score>0)||(e.details.score!=null&&e.details.score>e.details.full_score)))fail();
    if(['exam','mistake'].includes(e.kind)&&!textOK(e.details.subject))fail();
    ids.set(e.id,e);
  }
  for(const e of store.entities){
    if(e.parent_id&&(e.kind!=='mistake'||ids.get(e.parent_id)?.kind!=='exam'))fail();
    if(e.details.project_id&&(e.kind!=='learning'||ids.get(e.details.project_id)?.kind!=='project'))fail();
  }
  const tids=new Set();
  const tasks=[];
  for(const raw of store.tasks){
    if(!raw||typeof raw!=='object')fail();
    const t=normalizeTask(raw);
    if(!idOK(t.id)||tids.has(t.id)||!textOK(t.title)||!t.title.trim()||t.title.length>200||!['general','research','learning','education'].includes(t.module)||!Object.hasOwn(RECENT_STATUSES,t.status)||!Object.hasOwn(CATEGORY_NAMES,t.category)||!['normal','high'].includes(t.priority)||!textOK(t.notes)||!textOK(t.created))fail();
    if(t.entity_id&&modules[ids.get(t.entity_id)?.kind]!==t.module)fail();
    for(const k of TASK_DATE_FIELDS)if(!dateOK(t[k]))fail();
    for(const k of TASK_TIME_FIELDS)if(t[k]!==null&&!validTime(t[k]))fail();
    for(const k of TASK_TEXT_FIELDS)if(!textOK(t[k]))fail();
    if(t.previous_status!==null&&(!Object.hasOwn(RECENT_STATUSES,t.previous_status)||t.previous_status==='archived'))fail();
    for(const k of ['submitted_at','completed'])if(t[k]!==null&&(typeof t[k]!=='string'||!/^\d{4}-\d{2}-\d{2}T/.test(t[k])||!Number.isFinite(Date.parse(t[k]))))fail();
    if(t.due_time&&!t.due||t.start_time&&!t.start_date||t.end_time&&!t.start_date||t.end_date&&!t.start_date)throw new Error('填写时间或结束日期前，请先填写对应的日期。');
    const span=eventSpan(t);if(span&&span.end<span.start)throw new Error('结束日期和时间不能早于开始。');
    if(!Array.isArray(t.checklist)||t.checklist.length>200)fail();
    const checkids=new Set();for(const item of t.checklist){if(!item||!idOK(item.id)||checkids.has(item.id)||!textOK(item.text)||!item.text.trim()||typeof item.done!=='boolean')fail();checkids.add(item.id);}
    tids.add(t.id);
    tasks.push(t);
  }
  const rids=new Set();
  for(const r of store.reviews){
    if(!r||!idOK(r.id)||rids.has(r.id)||ids.get(r.entity_id)?.kind!=='mistake'||!['independent','hint','incorrect'].includes(r.result)||!textOK(r.note)||!textOK(r.reviewed)||!dateOK(r.next_review))fail();
    rids.add(r.id);
  }
  const financial=validateExpenses(store,ids,tids,fail);
  return {schema:3,entities:structuredClone(store.entities),tasks,reviews:structuredClone(store.reviews),...financial};
}
function newId(){if(crypto.randomUUID)return crypto.randomUUID().replaceAll('-','');return [...crypto.getRandomValues(new Uint8Array(16))].map(n=>n.toString(16).padStart(2,'0')).join('');}
async function api(path,options={}){
  const store=readStore(),method=options.method||'GET',body=options.body;
  if(path==='/state')return {...structuredClone(store),entities:[...store.entities].sort((a,b)=>b.updated.localeCompare(a.updated)),tasks:[...store.tasks].reverse(),reviews:[...store.reviews].reverse(),documents:[],jobs:[],backups:[],csrf:'browser-only',version:'HTML 3.0'};
  const now=new Date().toISOString();let result;
  if(path==='/entities'&&method==='POST'){
    result={...body,id:newId(),created:now,updated:now};store.entities.push(result);
  }else if(/^\/entities\/[a-f0-9]{32}$/.test(path)&&method==='PUT'){
    const e=store.entities.find(e=>e.id===path.split('/')[2]);if(!e)throw new Error('记录不存在');if(e.kind!==body.kind)throw new Error('不能更改记录类型');Object.assign(e,body,{id:e.id,created:e.created,updated:now});result=e;
  }else if(path==='/tasks'&&method==='POST'){
    result=normalizeTask({...body,id:newId(),created:now,updated:now,completed:body.status==='done'?now:null});store.tasks.push(result);
  }else if(/^\/tasks\/[a-f0-9]{32}$/.test(path)&&method==='PUT'){
    const t=store.tasks.find(t=>t.id===path.split('/')[2]);if(!t)throw new Error('任务不存在');const status=body.status||t.status;Object.assign(t,body,{id:t.id,created:t.created,updated:now,completed:status==='done'?(t.completed||now):status==='archived'?t.completed:null});result=normalizeTask(t);
  }else if(/^\/entities\/[a-f0-9]{32}\/reviews$/.test(path)&&method==='POST'){
    const e=store.entities.find(e=>e.id===path.split('/')[2]);if(e?.kind!=='mistake')throw new Error('只有错题可以记录再练');result={...body,id:newId(),entity_id:e.id,reviewed:now};store.reviews.push(result);e.details.next_review=body.next_review;e.updated=now;
  }else if(path==='/expenses'&&method==='POST'){
    result={...body,id:newId(),created:now,updated:now};store.expenses.push(result);
  }else if(/^\/expenses\/[a-f0-9]{32}$/.test(path)&&['PUT','DELETE'].includes(method)){
    const index=store.expenses.findIndex(e=>e.id===path.split('/')[2]);if(index<0)throw new Error('消费记录不存在');
    if(method==='DELETE'){result=store.expenses.splice(index,1)[0];}
    else {const old=store.expenses[index];result={...old,...body,id:old.id,created:old.created,updated:now};store.expenses[index]=result;}
  }else if(path==='/budgets'&&method==='PUT'){
    const index=store.budgets.findIndex(b=>b.ledger===body.ledger&&b.month===body.month);
    if(!Object.hasOwn(LEDGERS,body.ledger)||!validMonth(body.month))throw new Error('预算账本或月份不正确');
    if(body.amount_cents===null){if(index>=0)store.budgets.splice(index,1);result=null;}
    else {result={ledger:body.ledger,month:body.month,amount_cents:body.amount_cents};if(index>=0)store.budgets[index]=result;else store.budgets.push(result);}
  }else throw new Error('单文件 HTML 版不提供此项后端功能。');
  saveStore(store);return structuredClone(result);
}

document.addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');if(!button||busy)return;
  const {action,id,entity:entityId,kind,value,status,name,parent}=button.dataset;
  try {
    if(action==='close')return closeDialog();
    if(action==='quick')return quickDialog();
    if(action==='new-entity')return entityForm(kind,null,parent);
    if(action==='edit-entity')return entityForm(entityById(id).kind,id);
    if(action==='new-task')return taskForm(null,entityId);
    if(action==='edit-task')return taskForm(id);
    if(action==='new-review')return reviewForm(id);
    if(action==='filter-status'){statusFilter=value;return render();}
    if(action==='education-tab'){eduTab=value;return render();}
    if(action==='privacy'){hideFamily=!hideFamily;localStorage.setItem('workbench-hide-family',hideFamily?'1':'0');if(hideFamily&&view==='education'){location.hash='#overview';}render();return;}

    if(action==='toggle-task'){const t=state.tasks.find(t=>t.id===id);await api(`/tasks/${id}`,{method:'PUT',body:taskPayload(t,t.status==='done'?'todo':'done')});await reload();toast(t.status==='done'?'任务已重新打开':'已完成，进展已记录');}
    if(action==='archive-entity'){const e=entityById(id);await api(`/entities/${id}`,{method:'PUT',body:{kind:e.kind,title:e.title,status:e.status==='archived'?'active':'archived',parent_id:e.parent_id,details:e.details}});await reload();toast(e.status==='archived'?'记录已恢复':'已归档，可在“已归档”中恢复');}

});

  const form=input.closest('#expense-editor');if(!form)return;
  if(input.name==='ledger'){
    const category=form.elements.category,current=category.value;
    category.innerHTML=EXPENSE_CATEGORIES[input.value].map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('');
    if(!EXPENSE_CATEGORIES[input.value].includes(current))category.value='其他';
    $('#expense-scope-field').hidden=input.value==='unit';
  }
});
document.addEventListener('submit',async event=>{
  const form=event.target;if(!['expense-editor','expense-budget-editor'].includes(form.id))return;event.preventDefault();if(busy)return;
  busy=true;const submit=form.querySelector('[type=submit]');submit.disabled=true;$('#form-error').textContent='';
  try{
    const data=Object.fromEntries(new FormData(form).entries());
    if(form.id==='expense-budget-editor'){
      await api('/budgets',{method:'PUT',body:{ledger:form.dataset.ledger,month:form.dataset.month,amount_cents:data.amount.trim()?parseMoney(data.amount):null}});
    }else{
      const [kind,id]=data.related.split(':');
      const body={ledger:data.ledger,scope:data.ledger==='unit'?'personal':data.scope||'family',title:data.title.trim(),amount_cents:parseMoney(data.amount),date:data.date,category:data.category,payment:data.payment,merchant:data.merchant.trim(),notes:data.notes,entity_id:kind==='entity'?id:null,task_id:kind==='task'?id:null};
      if(body.ledger==='home'&&familyLinkedExpense(body,state.entities,state.tasks))body.scope='family';
      await api(form.dataset.id?'/expenses/'+form.dataset.id:'/expenses',{method:form.dataset.id?'PUT':'POST',body});
      expenseLedger=body.ledger;
      if(view==='expenses'){expenseMonth=body.date.slice(0,7);expenseCategory='all';expenseLinkFilter='all';location.hash='#expenses/'+body.ledger;}
    }
    $('#dialog').close();await reload();toast(form.id==='expense-budget-editor'?'本月预算已保存':'消费已保存');
  }catch(error){$('#form-error').textContent=error.message;}finally{busy=false;submit.disabled=false;}
});

api('/state').then(result=>{state=result;route();}).catch(error=>{$('#main').innerHTML=`<div class="error-box"><h2>暂时无法打开浏览器存储</h2><p>${esc(error.message)}</p><p>请使用普通浏览模式，允许此页面存储数据，再刷新重试。</p></div>`;});

</script>
</body>
</html>
